server:
  port: 8084
spring:
  application:
    name: care-orchestrator-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5444/care_db}
    username: ${DB_USER:medisync}
    password: ${DB_PASSWORD:medisync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
      group-id: care-orchestrator
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
care:
  gap:
    # An open gap older than this is escalated to CRITICAL (demo value; use hours/days in real life)
    escalation-minutes: ${GAP_ESCALATION_MINUTES:2}
    scan-interval-ms: 30000
