server:
  port: 8085
spring:
  application:
    name: handoff-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5445/handoff_db}
    username: ${DB_USER:medisync}
    password: ${DB_PASSWORD:medisync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
      group-id: handoff-notification
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
