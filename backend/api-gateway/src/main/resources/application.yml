server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth
          uri: lb://patient-service
          predicates: [ "Path=/api/auth/**" ]
        - id: patients
          uri: lb://patient-service
          predicates: [ "Path=/api/patients/**" ]
        - id: clinical
          uri: lb://clinical-service
          predicates: [ "Path=/api/clinical/**" ]
        - id: appointments
          uri: lb://appointment-service
          predicates: [ "Path=/api/appointments/**" ]
        - id: care
          uri: lb://care-orchestrator-service
          predicates: [ "Path=/api/care/**" ]
        - id: handoff
          uri: lb://handoff-service
          predicates: [ "Path=/api/handoffs/**,/api/notifications/**" ]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
medisync:
  jwt:
    secret: ${JWT_SECRET:medisync-demo-secret-key-change-me-0123456789}
